# Pipeline Configuration for Amazon ML Challenge 2026: Business Entity Resolution

project:
  name: "entity-resolution-engine"
  random_seed: 42

paths:
  data_dir: "data/student_resource/dataset"
  train_dir: "data/student_resource/dataset/train"
  test_dir: "data/student_resource/dataset/test"
  output_dir: "output"
  models_dir: "models"
  submission_file: "output/matching_results.tsv"
  candidate_file: "output/candidate_pairs.tsv"
  official_validator: "data/student_resource/utils/validate_submission.py"
  experiments_log: "evaluation/experiments.jsonl"
  experiments_summary: "evaluation/experiments.md"

data:
  train_s1_file: "train_source1.tsv"
  train_s2_file: "train_source2.tsv"
  train_s3_file: "train_source3.tsv"
  train_gt_file: "train_ground_truth.tsv"
  test_s1_file: "test_source1.tsv"
  test_s2_file: "test_source2.tsv"
  test_s3_file: "test_source3.tsv"
  id_col: "entity_id"
  name_col: "business_name"
  address_col: "business_address"
  country_col: "country"
  gt_s1_col: "source1_entity_id"
  gt_matched_col: "matched_entity_ids"
  candidate_col: "candidate_entity_ids"

validation:
  n_splits: 5
  stratified_sample_size: 3000
  metric: "entity_macro_f05"
  beta: 0.5

blocking:
  max_candidates_per_s1: 50
  passes:
    - name: "address_postal"
      enabled: true
    - name: "city_name_token"
      enabled: true
    - name: "name_fuzzy"
      enabled: true

model:
  type: "lightgbm" # lightgbm | catboost | xgboost
  params:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    random_state: 42
    n_jobs: -1

decision:
  default_threshold: 0.75
  search_step: 0.02
  min_threshold: 0.50
  max_threshold: 0.98
